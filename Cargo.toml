[package]
name = "wyoming-livekit-wakeword"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
# Streaming (v2) model support isn't on crates.io yet; 0.1.3 only runs v1 models.
livekit-wakeword = { git = "https://github.com/livekit/rust-sdks", rev = "052f089166b6864bc5f7e92906f6a7897b9f546c" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
